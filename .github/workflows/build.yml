
name: Build Ilyes Water APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter App
        run: flutter create ilyes_water

      - name: Build APK
        run: |
          cd ilyes_water
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilyes-Water
          path: ilyes_water/build/app/outputs/flutter-apk/app-release.apk
